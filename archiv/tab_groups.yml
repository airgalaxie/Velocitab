# ┣╸ Information: https://william278.net/project/velocitab
# ┗╸ Documentation: https://william278.net/docs/velocitab

groups:
- name: default
  headers:
  - <green>Airgalaxie Test Cloud</green>\n<rainbow:!1>_____________________</rainbow>
  - <green>Airgalaxie Test Cloud</green>\n<rainbow:!2>_____________________</rainbow>
  - <green>Airgalaxie Test Cloud</green>\n<rainbow:!3>_____________________</rainbow>
  - <green>Airgalaxie Test Cloud</green>\n<rainbow:!4>_____________________</rainbow>
  - <green>Airgalaxie Test Cloud</green>\n<rainbow:!5>_____________________</rainbow>
  footers:
  - <white>There are currently </white><green>%players_online%</green> / <gold>%max_players_online%</gold>
    <white> players online</white>\n\n<gray>Running Velocitab by William278 & AlexDev03</gray>
  format: <gold> [%server%] </gold> %prefix% <white>%username%</white> <gray> %ping%
    ms</gray>
  nametag:
    prefix: ''
    suffix: ''
  servers:
  - server2
  - server1
  sorting_placeholders:
  - '%role_weight%'
  - '%username_lower%'
  placeholder_replacements: {}
  collisions: false
  header_footer_update_rate: 1000
  format_update_rate: 1000
  nametag_update_rate: 1000
  placeholder_update_rate: 1000
  only_list_players_in_same_server: false
